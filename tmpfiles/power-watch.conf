# power-watch: let one group read the RAPL energy counters, so power-watch can
# measure CPU package power without root. The group is the 5th field of the rule
# below: `wheel` here; install.sh writes the group it uses (--group NAME, else
# $RAPL_GROUP, else wheel if it exists, else sudo) into the installed copy.
#
# Trade-off: the kernel makes energy_uj root-only (0400) since CVE-2020-8694
# ("Platypus"): fine-grained energy readings are a power side channel that can
# leak secrets (e.g. crypto keys) from other processes. Granting read access to a
# group re-opens that channel to its members. That is acceptable when the group
# already means "can become root" (wheel, or sudo with sudo rights); otherwise
# install with a narrower group: sudo ./install.sh --group NAME.
#
# The glob is shell-style: `*` does not cross `/`, and every RAPL zone (package
# intel-rapl:0, subzones intel-rapl:0:0, intel-rapl:0:1, and a psys zone such as
# intel-rapl:1 where the platform has one) is a direct entry of
# /sys/class/powercap, so one line covers them all.
#
# Boot ordering: if the intel_rapl module loads after systemd-tmpfiles-setup ran
# (or is reloaded), the files reappear as 0400 root. Re-apply with:
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/power-watch.conf
#
# Type Path                                       Mode User Group Age Argument
z      /sys/class/powercap/intel-rapl:*/energy_uj 0440 root wheel -   -
